# Alembic configuration for the business database.
# The real database URL is read from MINGLI_DB_URL in migrations/env.py.
# Keep this file ASCII-only: Windows Python reads it with the system locale
# (GBK on Chinese Windows), and non-ASCII comments break that read.

[alembic]
script_location = migrations
prepend_sys_path = .
sqlalchemy.url = sqlite:///data/app.sqlite3

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
