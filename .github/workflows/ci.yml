name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy lunar_python ephem
      - name: Run tests
        # 只跑不依赖 BGE-M3 权重的测试；检索/Agent 端到端在 eval/ 里单独跑
        run: pytest tests/test_fortune.py tests/test_agent_guardrails.py -q
