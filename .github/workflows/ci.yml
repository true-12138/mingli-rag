name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # 不装 torch / sentence-transformers / streamlit：
        # 全部测试都不加载 BGE-M3 权重，dense 检索与 LLM 调用都走 mock。
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy lunar_python ephem rank-bm25 requests python-dotenv \
            fastapi uvicorn httpx SQLAlchemy
      - name: Run tests
        run: pytest -q
