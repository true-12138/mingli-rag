name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # 不装 torch / sentence-transformers / streamlit：
        # 全部测试都不加载 BGE-M3 权重，dense 检索与 LLM 调用都走 mock。
        run: |
          python -m pip install --upgrade pip
          pip install pytest numpy lunar_python ephem rank-bm25 requests python-dotenv \
            fastapi uvicorn httpx SQLAlchemy alembic "mcp>=2.3,<3"
      - name: Run tests
        run: pytest -q
      - name: Migration smoke test
        # 迁移链断裂只有在真正 upgrade 时才会暴露；用临时 SQLite 跑完整条链。
        env:
          MINGLI_DB_URL: sqlite:////tmp/ci-migrations.sqlite3
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Type-check and build
        run: npm run build
