# 宿主机 Nginx：同源提供前端静态资源，并把 /api/ 反代到 127.0.0.1:8000。
#
# 安装时用 envsubst 注入 token，不要把 token 提交进仓库：
#   MINGLI_API_TOKEN=... envsubst '${MINGLI_API_TOKEN}' < deploy/nginx.conf \
#     | sudo tee /etc/nginx/sites-available/mingli > /dev/null
#   sudo ln -s /etc/nginx/sites-available/mingli /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前端产物放在 root 指向的目录（npm run build 后把 frontend/dist 拷过去）。
# 限流交给应用层 Redis 全局 20 槽：Nginx 的 limit_req 会误伤 200 条 SSE 连接。

server {
    listen 80;
    server_name demo.example.com;   # 换成自己的域名

    root /var/www/mingli-dist;
    index index.html;

    # 请求体只有一个问题 + 最多 20 条历史，64k 足够
    client_max_body_size 64k;

    # 前端静态资源；hash 路由也回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 与 SSE：去掉 /api 前缀后转给 FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端注入 Bearer token：浏览器不需要、也拿不到它
        proxy_set_header Authorization "Bearer ${MINGLI_API_TOKEN}";

        # SSE 必须关缓冲，否则逐 token 会变成一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 探活不记日志；/metrics 不对外，需要时在服务器上访问 127.0.0.1:8000/metrics
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location = /metrics {
        return 404;
    }
}
