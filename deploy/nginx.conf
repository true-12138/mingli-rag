# 宿主机 Nginx：同源提供前端静态资源，并把 /api/ 反代到 127.0.0.1:8000。
#
# 安装时用 envsubst 注入 token，不要把 token 提交进仓库：
#   MINGLI_API_TOKEN=... envsubst '${MINGLI_API_TOKEN}' < deploy/nginx.conf \
#     | sudo tee /etc/nginx/sites-available/mingli > /dev/null
#   sudo ln -s /etc/nginx/sites-available/mingli /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# 前端产物放在 root 指向的目录（npm run build 后把 frontend/dist 拷过去）。

# ---------- 限流 ----------
# 和 deploy/nginx/default.conf.template（Docker 版）保持一致，两处要一起改。
# 应用层的 Redis 20 个回答槽是并发闸门，管的是「同时有几路在答」；
# 这里管的是「同一个 IP 一分钟能敲多少下」，防的是脚本循环消耗模型额度。
# 压测请直连 127.0.0.1:8000，不要穿过这一层。

# 全部 API：拦无脑扫接口的
limit_req_zone $binary_remote_addr zone=mingli_api:10m rate=60r/m;

# 只有会调模型、会花钱的接口才进这个 zone。map 默认值是空串，
# nginx 对空 key 不计账，其余接口不受这一档影响。
map $uri $mingli_llm_key {
    default                            "";
    ~^/api/chat                        $binary_remote_addr;
    ~^/api/v1/conversations/[^/]+/chat $binary_remote_addr;
    ~^/api/v1/fortune/read             $binary_remote_addr;
    ~^/api/v1/chunks/interpret         $binary_remote_addr;
    ~^/api/v1/terms/annotate           $binary_remote_addr;
    ~^/api/v1/favorites/export\.md     $binary_remote_addr;
}
limit_req_zone $mingli_llm_key zone=mingli_llm:10m rate=12r/m;

# limit_req 默认返回 503；这里改成 429，前端会读 detail 显示成一句人话。
limit_req_status 429;

server {
    listen 80;
    # 用 IP 或任意域名访问都要落到这里：`_` 不匹配任何名字，只能当默认站。
    # 所以本文件必须是 80 端口上的默认 server——装完记得删掉 sites-enabled/default，
    # 否则访问 http://<IP>/ 拿到的是 nginx 欢迎页。
    server_name _;

    root /var/www/mingli-dist;
    index index.html;

    # 请求体只有一个问题 + 最多 20 条历史，64k 足够
    client_max_body_size 64k;

    # 前端静态资源；hash 路由也回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 限流命中的响应：给前端一段能直接显示的 JSON（前端读 detail 字段）
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"问得太快了，歇几秒再试。"}';
    }

    # API 与 SSE：去掉 /api 前缀后转给 FastAPI
    location /api/ {
        # 两档同时生效：整体 60/min；调模型的接口再叠一层 12/min（burst 4）
        limit_req zone=mingli_api burst=20 nodelay;
        limit_req zone=mingli_llm burst=4 nodelay;

        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 服务端注入 Bearer token：浏览器不需要、也拿不到它
        proxy_set_header Authorization "Bearer ${MINGLI_API_TOKEN}";

        # SSE 必须关缓冲，否则逐 token 会变成一次性返回
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 探活不记日志；/metrics 不对外，需要时在服务器上访问 127.0.0.1:8000/metrics
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location = /metrics {
        return 404;
    }
}
