# /etc/nginx/sites-available/mingli-api
# 用法见 deploy/README.md；把 server_name 换成自己的域名。

limit_req_zone $binary_remote_addr zone=mingli_api:10m rate=2r/s;

server {
    listen 80;
    server_name api.example.com;

    # 请求体只有一个问题 + 最多 20 条历史，64k 足够
    client_max_body_size 64k;

    # 探活不记日志、不限流
    location = /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }

    location / {
        limit_req zone=mingli_api burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 多 Agent 一次可能跑 6 步，单请求最长 120s
        proxy_connect_timeout 5s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
